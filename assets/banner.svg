<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Radial Gradients -->
    <radialGradient id="glowViolet" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- SVG Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes slowRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes slowCounterRotate {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes floatSlow1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes floatSlow2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }

      .aperture-group {
        transform-origin: 960px 180px;
        animation: slowRotate 50s linear infinite;
      }
      .aperture-inner {
        transform-origin: 960px 180px;
        animation: slowCounterRotate 35s linear infinite;
      }
      .card-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .card-2 {
        animation: floatSlow2 8s ease-in-out infinite 1s;
      }
      .pulsing-orb {
        transform-origin: 960px 180px;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .animated-grid {
        stroke: #334155;
        stroke-opacity: 0.22;
        stroke-width: 1;
      }
      .data-stream {
        stroke: #38BDF8;
        stroke-opacity: 0.4;
        stroke-dasharray: 6 6;
        animation: dashAnim 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowViolet)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowCyan)" />

  <!-- Background Decorative Grid Lines -->
  <g class="animated-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Interactive / Dynamic Background Elements: Photographic Lens & Aperture Rings (placed safely to the right) -->
  <g class="pulsing-orb">
    <circle cx="960" cy="180" r="140" fill="url(#lensGlow)" />
  </g>

  <!-- Rotating Aperture Blades (Background Geometric Art) -->
  <g class="aperture-group">
    <circle cx="960" cy="180" r="110" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
    <circle cx="960" cy="180" r="85" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="12 12" opacity="0.5" />
    <!-- Aperture Petals -->
    <path d="M 960 100 A 80 80 0 0 1 1030 145 L 960 180 Z" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-width="1.2" opacity="0.7" />
    <path d="M 1030 145 A 80 80 0 0 1 1030 215 L 960 180 Z" fill="#818CF8" fill-opacity="0.08" stroke="#818CF8" stroke-width="1.2" opacity="0.7" />
    <path d="M 1030 215 A 80 80 0 0 1 960 260 L 960 180 Z" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-width="1.2" opacity="0.7" />
    <path d="M 960 260 A 80 80 0 0 1 890 215 L 960 180 Z" fill="#F472B6" fill-opacity="0.08" stroke="#F472B6" stroke-width="1.2" opacity="0.7" />
    <path d="M 890 215 A 80 80 0 0 1 890 145 L 960 180 Z" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-width="1.2" opacity="0.7" />
    <path d="M 890 145 A 80 80 0 0 1 960 100 L 960 180 Z" fill="#FBBF24" fill-opacity="0.08" stroke="#FBBF24" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- Inner Counter-rotating ring -->
  <g class="aperture-inner">
    <circle cx="960" cy="180" r="55" fill="#0F172A" fill-opacity="0.7" stroke="#38BDF8" stroke-width="2" />
    <circle cx="960" cy="180" r="32" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="960" cy="180" r="14" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- Subtle Data Stream / Flow connecting to aperture -->
  <path d="M 620 180 L 880 180" class="data-stream" />
  <path d="M 640 130 C 760 130, 800 160, 890 170" class="data-stream" />
  <path d="M 640 230 C 760 230, 800 200, 890 190" class="data-stream" />

  <!-- Floating Dynamic Tech Cards (positioned to complement layout without overlapping text) -->
  <g class="card-1" filter="url(#badgeShadow)">
    <rect x="740" y="55" width="170" height="42" rx="10" fill="url(#cardBg)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="762" cy="76" r="6" fill="#10B981" />
    <text x="778" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">Local AI &amp; Privacy</text>
  </g>

  <g class="card-2" filter="url(#badgeShadow)">
    <rect x="750" y="260" width="180" height="42" rx="10" fill="url(#cardBg)" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="772" cy="281" r="6" fill="#38BDF8" />
    <text x="788" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">Self-Hosted Vaults</text>
  </g>

  <!-- FOREGROUND CONTENT: High Z-index, perfectly legible, crisp typography -->
  <g transform="translate(65, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="48" width="220" height="30" rx="15" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="63" r="5" fill="#38BDF8" />
    <text x="30" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Photo Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#CBD5E1">
      Top Self-Hosted Galleries, Cloud Archives &amp; AI-Powered Organizing Tools
    </text>

    <!-- Description line -->
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      Explore leading open-source alternatives to Google Photos, enterprise SaaS suites, &amp; metadata engines.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 240)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">🏠 Self-Hosted</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="125" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="159" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#A78BFA">🤖 Local AI</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="145" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="294" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34D399">🔐 Zero-Knowledge</text>

      <!-- Tag 4 -->
      <rect x="435" y="0" width="135" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="449" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F472B6">☁️ Cloud Backup</text>
    </g>
  </g>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
</svg>
